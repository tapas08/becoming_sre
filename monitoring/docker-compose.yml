# ** NOTE ** #
## Make sure the application docker compose is run first before running this one.
#
# Just for the sake of clarity, this is a docker-compose file that sets up a monitoring stack using Prometheus and Grafana.
# The services defined here will be attached to the same network as the other services in our application.
x-monitoring: &monitoring
  restart: unless-stopped
  networks:
    - besrenet


services:
  prometheus:
    <<: *monitoring
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
  # grafana:
  #   <<: *monitoring
  #   container_name: grafana
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  cadvisor:
    <<: *monitoring
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

networks:
  besrenet:
    external: true
    name: app_besrenet